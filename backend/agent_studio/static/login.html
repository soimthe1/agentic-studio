<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob: data:; form-action 'self'; base-uri 'self'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · {{BRAND}}</title>
<link rel="icon" type="image/png" href="/auth/assets/favicon.png">
<style>
  @font-face { font-family: Inter; src: url(/auth/assets/inter.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: "IBM Plex Sans Arabic"; src: url(/auth/assets/plex-arabic-700.woff2) format("woff2"); font-weight: 700; font-display: swap; }
  :root {
    --graphite: #0B0F14; --navy: #0A1E3D; --cyan: #00D8FF; --aqua: #00F5C8;
    --lime: #A6FF3D; --silver: #C8D2DE; --mist: #EEF3F7; --white: #FFFFFF;
    --danger: #FF8A8A;
    --sans: Inter, "IBM Plex Sans Arabic", Arial, sans-serif;
    --arabic: "IBM Plex Sans Arabic", Tahoma, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--graphite); color: var(--white); font-family: var(--sans);
    font-size: 16px; line-height: 1.5; min-height: 100dvh;
    display: grid; grid-template-columns: minmax(0, 7fr) minmax(360px, 5fr);
  }

  /* Brand field: the one bold element. */
  .field {
    position: relative; overflow: hidden; padding: 56px 64px;
    background: linear-gradient(160deg, var(--navy) 0%, var(--graphite) 78%);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .field .emblem {
    position: absolute; right: -9%; bottom: -14%; width: min(68vh, 62%);
    aspect-ratio: 1; opacity: .9; pointer-events: none;
  }
  .field .lockup { position: relative; display: flex; align-items: center; gap: 14px; }
  .field .lockup img { width: 40px; height: 40px; }
  .field .lockup span { font-weight: 700; letter-spacing: .04em; }
  .wordmark { position: relative; max-width: 30ch; }
  .wordmark .ar {
    font-family: var(--arabic); font-weight: 700; font-size: clamp(56px, 8vw, 104px);
    line-height: 1.05; margin: 0; direction: rtl; text-align: left;
  }
  .wordmark .en {
    font-weight: 800; font-size: clamp(28px, 3.4vw, 44px); letter-spacing: .08em; margin: 8px 0 0;
  }
  .wordmark .tag { color: var(--cyan); font-weight: 600; margin: 4px 0 0; font-size: 18px; }
  .wordmark .lede { color: var(--silver); margin: 28px 0 0; font-size: 18px; max-width: 34ch; }

  /* Form */
  main { display: flex; align-items: center; justify-content: center; padding: 48px 32px; }
  form { width: 100%; max-width: 380px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; font-weight: 700; }
  .hint { color: var(--silver); margin: 0 0 32px; }
  label { display: block; font-weight: 500; margin: 0 0 8px; }
  .row { margin-bottom: 20px; }
  .control { position: relative; }
  input {
    width: 100%; height: 48px; padding: 0 14px; font: inherit; color: var(--white);
    background: #0F1A2B; border: 1px solid #2B3D58; border-radius: 10px;
    transition: border-color .15s ease;
  }
  input:hover { border-color: #3D5577; }
  input:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; border-color: var(--cyan); }
  input[aria-invalid="true"] { border-color: var(--danger); }
  .control input[type="password"], .control input[data-revealed] { padding-right: 76px; }
  .reveal {
    position: absolute; right: 6px; top: 6px; height: 36px; min-width: 64px; padding: 0 10px;
    font: inherit; font-size: 14px; font-weight: 500; color: var(--cyan);
    background: transparent; border: 0; border-radius: 8px; cursor: pointer;
  }
  .reveal:hover { background: rgba(0, 216, 255, .08); }
  .reveal:focus-visible { outline: 3px solid var(--cyan); outline-offset: 0; }
  .error {
    display: flex; gap: 10px; align-items: flex-start; margin: 0 0 20px; padding: 12px 14px;
    border: 1px solid rgba(255, 138, 138, .45); border-radius: 10px; background: rgba(255, 138, 138, .08);
    color: #FFD0D0;
  }
  .error[hidden] { display: none; }
  .error svg { flex: none; margin-top: 3px; }
  button[type="submit"] {
    width: 100%; height: 48px; font: inherit; font-weight: 700; color: var(--graphite);
    background: var(--lime); border: 0; border-radius: 10px; cursor: pointer;
    transition: filter .15s ease;
  }
  button[type="submit"]:hover { filter: brightness(.92); }
  button[type="submit"]:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
  button[type="submit"][disabled] { opacity: .55; cursor: progress; }
  .foot { color: #8FA0B6; font-size: 14px; margin: 24px 0 0; }

  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .field { padding: 32px 24px 40px; min-height: 0; }
    .field .emblem { width: 220px; right: -40px; bottom: -60px; opacity: .5; }
    .wordmark .lede { display: none; }
    .wordmark { margin-top: 24px; }
    main { align-items: flex-start; padding: 32px 24px 48px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <section class="field" aria-label="{{BRAND}}">
    <div class="lockup"><img src="/auth/assets/logo.svg" alt="" width="40" height="40"><span>{{BRAND}}</span></div>
    <div class="wordmark">
      <p class="ar" lang="ar">{{BRAND_AR}}</p>
      <p class="en">{{BRAND}}</p>
      <p class="tag">{{TAGLINE}}</p>
      <p class="lede">Build, orchestrate and run intelligent agents.</p>
    </div>
    <img class="emblem" src="/auth/assets/logo.svg" alt="">
  </section>

  <main>
    <form method="post" action="{{ACTION}}" novalidate>
      <h1>{{TITLE}}</h1>
      <p class="hint">{{HINT}}</p>

      <div id="form-error" class="error" role="alert" {{ERROR_HIDDEN}}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 17h.01"/></svg>
        <span>{{ERROR}}</span>
      </div>

      <div class="row">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" value="{{USERNAME}}" autocomplete="username"
               autocapitalize="none" spellcheck="false" required aria-invalid="{{INVALID}}" aria-describedby="form-error" autofocus>
      </div>
      <div class="row">
        <label for="password">Password</label>
        <div class="control">
          <input id="password" name="password" type="password" autocomplete="current-password" required
                 aria-invalid="{{INVALID}}" aria-describedby="form-error">
          <button class="reveal" type="button" aria-controls="password" aria-pressed="false">Show</button>
        </div>
      </div>
      <div class="row" {{CONFIRM_HIDDEN}}>
        <label for="confirm">Password again</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password">
      </div>
      <button type="submit">{{BUTTON}}</button>
      <p class="foot">{{FOOT}}</p>
    </form>
  </main>
  <script src="/auth/login.js"></script>
</body>
</html>
