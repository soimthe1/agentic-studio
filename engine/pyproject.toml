[project]
name = "studio-engine"
version = "0.1.0"
description = "Agent Studio extension installed in the Langflow engine image: config adapter + session endpoint."
requires-python = ">=3.12"
dependencies = []   # runs inside the Langflow image (fastapi, pyyaml come from it)

[project.entry-points."langflow.plugins"]
studio-engine = "studio_engine.plugin:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
