[project]
name = "agent_studio"
version = "0.1.0"
description = "Agent Studio - app backend (FastAPI). Talks to the Langflow engine over HTTP."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.5",
  "uvicorn[standard]==0.54.0",
  "httpx==0.28.1",
  "ldap3==2.9.1",
  "pyyaml==6.0.3",
  "python-multipart==0.0.33",
  "psycopg[binary]==3.3.9",
  "cryptography==50.0.2",
]

[tool.setuptools.packages.find]
include = ["agent_studio*"]

[tool.setuptools.package-data]
agent_studio = ["static/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
