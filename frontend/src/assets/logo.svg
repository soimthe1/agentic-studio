<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Built-in neutral mark (three connected agents). A deployment shows its own logo from config/brand/logo.svg. -->
  <defs>
    <linearGradient id="nb" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#20D6C5"/>
      <stop offset="1" stop-color="#A3E635"/>
    </linearGradient>
  </defs>
  <path d="M18 44 L32 18 L46 44 Z" stroke="url(#nb)" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="32" cy="18" r="8" fill="url(#nb)"/>
  <circle cx="18" cy="44" r="8" fill="url(#nb)"/>
  <circle cx="46" cy="44" r="8" fill="url(#nb)"/>
</svg>
